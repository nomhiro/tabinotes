name: Deploy shared trip to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/share-pages.yml"
      - "share/**"
      - "scripts/build-share.mjs"
      - "src/components/**"
      - "src/trips/europe-2026/phrases.js"
      - "src/trips/europe-2026/EuropeTrip.jsx"
      - "src/trips/registry.js"
      - "public/phrases/**"
      - "test/share.test.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-trip-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:share
      - run: npm run build:share:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-share
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
